<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxConsign · 二手奢侈品寄卖鉴定与争议退款平台</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1d202b; --line:#2a2e3c;
    --gold:#c9a86a; --gold2:#e4cfa3; --txt:#e8e6e1; --mut:#9aa0af;
    --ok:#4caf82; --warn:#e0a64e; --bad:#e06b6b; --info:#6b9fe0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  a{color:var(--gold2);cursor:pointer}
  button{font-family:inherit}
  .hidden{display:none!important}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#1b1e2a,#0e0f13)}
  .login-card{width:760px;max-width:94vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px}
  .brand{font-size:26px;letter-spacing:6px;color:var(--gold);font-weight:600}
  .brand small{display:block;letter-spacing:2px;color:var(--mut);font-size:12px;margin-top:6px}
  .acct-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
  .acct{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;text-align:left}
  .acct:hover{border-color:var(--gold)}
  .acct b{display:block;font-size:12.5px}
  .acct span{color:var(--mut);font-size:11px}
  .login-row{display:flex;gap:10px;margin-top:8px}
  input,select,textarea{background:#11131a;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:13px;width:100%}
  textarea{min-height:60px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .btn{background:linear-gradient(180deg,#d8ba84,#b8935a);color:#1a140a;border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn.danger{background:linear-gradient(180deg,#e08585,#c45656);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* app */
  header{display:flex;align-items:center;gap:16px;padding:0 22px;height:58px;background:#12141c;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header .brand{font-size:17px;letter-spacing:3px}
  header .brand small{display:inline;margin-left:10px}
  .spacer{flex:1}
  .who{color:var(--mut);font-size:12.5px}
  .who b{color:var(--gold2)}
  .tabs{display:flex;gap:4px;padding:10px 22px 0;background:#12141c;border-bottom:1px solid var(--line)}
  .tab{padding:9px 18px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);border:1px solid transparent;border-bottom:none}
  .tab.active{background:var(--bg);color:var(--gold2);border-color:var(--line)}
  main{padding:20px 22px;display:grid;grid-template-columns:430px 1fr;gap:18px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .panel h3{margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px}
  .panel .body{padding:14px 16px;max-height:calc(100vh - 190px);overflow:auto}
  .list-item{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:9px;cursor:pointer;background:var(--panel2)}
  .list-item:hover{border-color:var(--gold)}
  .list-item.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .li-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .code{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.5px}
  .muted{color:var(--mut)}
  .price{color:var(--gold2);font-weight:600}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
  .tag.gold{color:var(--gold);border-color:#5a4a2e;background:#241f13}
  .tag.ok{color:var(--ok);border-color:#2c5143}
  .tag.warn{color:var(--warn);border-color:#5a452a}
  .tag.bad{color:var(--bad);border-color:#5a2e2e}
  .tag.info{color:var(--info);border-color:#2e445a}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .field{margin-bottom:10px}
  .field label{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
  .section{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;background:var(--panel2)}
  .section>div.t{padding:9px 12px;font-weight:600;color:var(--gold2);border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .section .c{padding:10px 12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:500}
  .timeline .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .timeline .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;flex:none}
  .timeline .ev .meta{color:var(--mut);font-size:11px}
  .ev b{color:var(--txt)}
  .pill-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  /* modal */
  #modalMask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center}
  .modal{width:560px;max-width:94vw;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:12px}
  .modal h4{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);color:var(--gold2)}
  .modal .mc{padding:16px 18px}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  /* toast */
  #toast{position:fixed;right:20px;bottom:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);padding:11px 15px;border-radius:8px;max-width:420px}
  .toast.err{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12.5px}
  .kv .k{color:var(--mut)}
  .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}
  .stat .n{font-size:22px;color:var(--gold);font-weight:600}
  .stat .l{color:var(--mut);font-size:12px}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .toolbar select,.toolbar input{width:auto}
  .rolechip{font-size:11px;color:#0e0f13;background:var(--gold);border-radius:4px;padding:1px 7px;font-weight:600}
  pre{white-space:pre-wrap;word-break:break-all;margin:0;font-family:inherit;font-size:12.5px;line-height:1.6}
  .empty{color:var(--mut);text-align:center;padding:30px 0}
  /* 通知铃铛 */
  .bell-badge{background:var(--bad);color:#fff;border-radius:20px;font-size:10px;padding:0 5px;margin-left:3px;font-weight:700}
  .bell-panel{position:absolute;right:0;top:38px;width:380px;max-height:440px;overflow:auto;background:var(--panel2);
    border:1px solid var(--gold);border-radius:10px;z-index:40;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .bell-item{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .bell-item:hover{background:#22253200}
  .bell-item.unread{background:#242117}
  .bell-item .bt{font-weight:600;font-size:12.5px}
  .bell-item .bc{color:var(--mut);font-size:12px;margin-top:3px;white-space:pre-wrap}
  .bell-item .bm{color:var(--mut);font-size:10.5px;margin-top:4px}
  .lock-banner{background:#2a1a1a;border:1px solid var(--bad);color:#f0b4b4;border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:13px}
  .pause-banner{background:#2a2416;border:1px solid var(--warn);color:#eccf9a;border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:13px}
  .diff-box{background:#14161f;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12.5px;line-height:1.7}
  .badge-new{background:var(--bad);color:#fff;border-radius:3px;font-size:10px;padding:0 5px;margin-left:6px}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="login-card">
    <div class="brand">LUXCONSIGN<small>二手奢侈品寄卖 · 鉴定 · 争议退款一体化平台</small></div>
    <p class="muted" style="margin:16px 0 6px">演示账号（点击自动填充，密码见账号卡片）：</p>
    <div class="acct-grid" id="acctGrid"></div>
    <div class="login-row">
      <input id="liUser" placeholder="用户名">
      <input id="liPass" placeholder="密码" type="password" style="max-width:160px">
      <button class="btn" id="liBtn">登录</button>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="app" class="hidden">
  <header>
    <div class="brand">LUXCONSIGN<small>寄卖鉴定与争议退款平台</small></div>
    <div class="spacer"></div>
    <div class="who">当前：<b id="whoName"></b> <span class="rolechip" id="whoRole"></span></div>
    <div style="position:relative">
      <button class="btn ghost sm" id="bellBtn" title="通知">🔔 <span id="bellCount" class="bell-badge hidden">0</span></button>
      <div id="bellPanel" class="bell-panel hidden"></div>
    </div>
    <button class="btn ghost sm" id="logoutBtn">退出</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <main>
    <div>
      <div class="panel">
        <h3 id="listTitle">寄卖单</h3>
        <div class="body" id="listBody"></div>
      </div>
    </div>
    <div class="panel">
      <h3 id="detailTitle">详情</h3>
      <div class="body" id="detailBody"><div class="empty">请选择左侧记录</div></div>
    </div>
  </main>
</div>

<div id="modalMask" class="hidden"><div class="modal">
  <h4 id="mTitle"></h4>
  <div class="mc" id="mBody"></div>
  <div class="mf"><button class="btn ghost" id="mCancel">取消</button><button class="btn" id="mOk">提交</button></div>
</div></div>
<div id="toast"></div>

<script>
/* ================= 基础 ================= */
const $ = (s, r=document) => r.querySelector(s);
const api = async (path, opts={}) => {
  const headers = { ...(localStorage.tok ? {Authorization:'Bearer '+localStorage.tok} : {}) };
  if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, {
    ...opts,
    headers,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || ('HTTP '+res.status));
  return data;
};
const toast = (msg, type='') => {
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>t.remove(), 4200);
};
const fmt = (v) => v==null ? '—' : '¥' + Number(v).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
const CAT = {bag:'箱包', watch:'腕表', jewelry:'珠宝首饰', fashion:'鞋服'};
const ROLE = {seller:'卖家', buyer:'买家', authenticator:'鉴定师', warehouse:'仓库', ops:'运营', cs:'客服', finance:'财务', admin:'管理员'};
const STATUS = {
  drafted:'草稿', shipped:'已寄出', received:'已签收待鉴定', authenticating:'鉴定中/存疑', authenticated:'已鉴定为真',
  rejected_fake:'鉴定为假·退回', quoted:'已报价', listed:'在售', sold:'已售出', shipping:'平台发货中',
  delivered:'买家已签收', aftersales:'售后期', completed:'交易完成', disputed:'争议处理中',
  withdrawn:'已撤回', returning_seller:'退回卖家途中', returned_seller:'卖家已收回',
  buyer_returning:'买家退货中', return_received:'退货已验收入库', auction_transferred:'已转拍卖', destroyed:'已销毁',
};
const stTag = (s) => {
  const bad = ['rejected_fake']; const warn = ['disputed','authenticating']; const ok=['completed','delivered','listed','authenticated'];
  const cls = bad.includes(s)?'bad':warn.includes(s)?'warn':ok.includes(s)?'ok':'';
  return `<span class="tag ${cls}">${STATUS[s]||s}</span>`;
};
const DT = (s) => s ? new Date(s).toLocaleString('zh-CN', {hour12:false}) : '';

const ACCOUNTS = [
  ['seller_alice','alice123','卖家·阿琳'],['seller_bob','bob123','卖家·柏先生'],
  ['buyer_cara','cara123','买家·卡拉'],['buyer_dan','dan123','买家·阿丹'],
  ['auth_evan','evan123','鉴定师·埃文(腕表)'],['auth_fiona','fiona123','鉴定师·菲奥娜(箱包珠宝)'],
  ['auth_gale','gale123','复鉴员·盖尔'],['wh_grace','grace123','仓库·格蕾丝'],
  ['ops_henry','henry123','运营·亨利'],['cs_iris','iris123','客服·艾瑞斯'],
  ['fin_jack','jack123','财务·杰克'],['admin','admin123','平台管理员'],
];

/* ================= 登录 ================= */
function renderAccts(){
  $('#acctGrid').innerHTML = ACCOUNTS.map(([u,p,n])=>
    `<div class="acct" data-u="${u}" data-p="${p}"><b>${n}</b><span>${u} / ${p}</span></div>`).join('');
  $('#acctGrid').querySelectorAll('.acct').forEach(el=>el.onclick=()=>{
    $('#liUser').value=el.dataset.u; $('#liPass').value=el.dataset.p;
  });
}
$('#liBtn').onclick = login;
$('#liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
async function login(){
  try{
    const d = await api('/api/auth/login', {method:'POST', body:{username:$('#liUser').value.trim(), password:$('#liPass').value}});
    localStorage.tok=d.token; localStorage.me=JSON.stringify(d.user);
    enterApp();
  }catch(e){ toast(e.message,'err'); }
}
$('#logoutBtn').onclick = ()=>{ localStorage.removeItem('tok'); location.reload(); };

/* ================= 应用状态 ================= */
let ME=null, TAB='con', selectedId=null, selectedReauth=null, listCache=[], stdCache=[], usersCache=[], liveCache=[], kbCache=[];
function enterApp(){
  ME = JSON.parse(localStorage.me);
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#whoName').textContent = ME.displayName; $('#whoRole').textContent = ROLE[ME.role];
  buildTabs(); switchTab(ME.role==='buyer' ? 'orders' : 'con');
  loadNotifications();
  if (window.__bellTimer) clearInterval(window.__bellTimer);
  window.__bellTimer = setInterval(loadNotifications, 15000);
}

/* 通知中心 */
async function loadNotifications(){
  try{
    const d = await api('/api/notifications');
    const badge=$('#bellCount');
    if(d.unread>0){ badge.textContent=d.unread; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
    $('#bellPanel').innerHTML = (d.items.length?d.items:[{title:'暂无通知',content:'',is_read:true}]).map(n=>`
      <div class="bell-item ${n.is_read?'':'unread'}" data-id="${n.id}" data-lt="${n.link_type||''}" data-lid="${n.link_id||''}">
        <div class="bt">${n.title}</div>
        ${n.content?`<div class="bc">${n.content}</div>`:''}
        <div class="bm">${DT(n.created_at)} ${n.is_read?'':'· 未读'}</div>
      </div>`).join('');
    $('#bellPanel').querySelectorAll('.bell-item[data-id]').forEach(el=>el.onclick=async()=>{
      await api(`/api/notifications/${el.dataset.id}/read`,{method:'POST'});
      const lt=el.dataset.lt, lid=Number(el.dataset.lid);
      $('#bellPanel').classList.add('hidden');
      if(lt==='consignment'){ switchTab('con'); setTimeout(()=>openConsignment(lid),400); }
      else if(lt==='order'){ switchTab('orders'); }
      else if(lt==='dispute'){ switchTab('disputes'); }
      else if(lt==='reauth_review'){ selectedReauth=lid; switchTab('reauth'); }
      loadNotifications();
    });
  }catch(e){ /* 未登录或无权限时静默 */ }
}
$('#bellBtn').onclick=(e)=>{ e.stopPropagation(); $('#bellPanel').classList.toggle('hidden'); };
document.addEventListener('click',(e)=>{ if(!$('#bellPanel').classList.contains('hidden') && !e.target.closest('#bellPanel') && !e.target.closest('#bellBtn')) $('#bellPanel').classList.add('hidden'); });
async function openConsignment(id){
  const el=[...document.querySelectorAll('#listBody .list-item')].find(x=>Number(x.dataset.id)===id);
  if(el){ el.click(); } else { await renderConsignmentDetail(id); }
}
const isStaff = () => !['seller','buyer'].includes(ME.role);

function buildTabs(){
  const tabs = [{k:'con', n:'寄卖单'}];
  if (ME.role==='buyer') tabs.length=0, tabs.push({k:'shop',n:'在售商城'},{k:'orders',n:'我的订单'}), tabs.push({k:'con',n:'我的争议单'});
  if (ME.role==='seller') tabs.push({k:'orders',n:'相关订单'});
  if (['warehouse','ops','admin','cs','finance'].includes(ME.role)) tabs.push({k:'orders',n:'订单/物流'});
  tabs.push({k:'reauth',n:'复鉴闭环'});
  tabs.push({k:'disputes',n:'争议中心'});
  if (isStaff()) tabs.push({k:'admin',n:'运营管理'});
  $('#tabs').innerHTML = tabs.map(t=>`<div class="tab" data-k="${t.k}">${t.n}</div>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(el=>el.onclick=()=>switchTab(el.dataset.k));
}
async function switchTab(k){
  TAB=k; selectedId=null;
  $('#tabs').querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.k===k));
  $('#detailBody').innerHTML='<div class="empty">请选择左侧记录</div>';
  if (k==='con'||k==='shop') { $('#listTitle').textContent = k==='shop'?'在售商城':'寄卖单'; await loadConsignments(); }
  if (k==='orders') { $('#listTitle').textContent='订单 / 物流'; await loadOrders(); }
  if (k==='disputes') { $('#listTitle').textContent='争议案件'; await loadDisputes(); }
  if (k==='reauth') { $('#listTitle').textContent='复鉴推翻案件'; await loadReauths(); }
  if (k==='admin') { $('#listTitle').textContent='运营管理'; renderAdminList(); }
}

/* ================= 列表加载 ================= */
async function loadConsignments(){
  try{
    const path = TAB==='shop' ? '/api/consignments?status=listed' : '/api/consignments';
    const d = await api(path); listCache=d.items;
    $('#listBody').innerHTML = d.items.length ? d.items.map(c=>`
      <div class="list-item" data-id="${c.id}">
        <div class="li-top"><span class="code">${c.code}</span><span>${c.locked?'<span class="tag bad">🔒已锁定</span>':''}${stTag(c.status)}</span></div>
        <div style="margin:5px 0"><b>${c.brand}</b> ${c.model}</div>
        <div class="muted" style="font-size:12px">
          ${CAT[c.category]} · ${c.seller_name}
          ${c.high_value?'<span class="tag gold">高价值</span>':''}
          ${c.dual_auth?'<span class="tag info">双人鉴定</span>':''}
          ${c.limited_edition?'<span class="tag warn">限量</span>':''}
        </div>
        <div style="margin-top:4px">
          ${c.sale_price?`<span class="price">${fmt(c.sale_price)}</span>`:`<span class="muted">期望 ${fmt(c.expected_price)}</span>`}
          ${c.grade?`<span class="tag ok">成色 ${c.grade}</span>`:''}
        </div>
      </div>`).join('') : '<div class="empty">暂无寄卖单</div>';
    $('#listBody').querySelectorAll('.list-item').forEach(el=>el.onclick=()=>{
      selectedId=Number(el.dataset.id);
      $('#listBody').querySelectorAll('.list-item').forEach(x=>x.classList.toggle('sel',x===el));
      renderConsignmentDetail(selectedId);
    });
  }catch(e){ toast(e.message,'err'); }
}
async function loadOrders(){
  const d = await api('/api/orders');
  $('#listBody').innerHTML = d.items.length ? d.items.map(o=>`
    <div class="list-item" data-id="${o.id}">
      <div class="li-top"><span class="code">${o.code}</span>
        <span>${o.settlement_paused?'<span class="tag bad">⏸结算暂停</span>':''}<span class="tag ${o.status==='refunded'?'bad':o.status==='completed'?'ok':'info'}">${{placed:'待发货',shipping:'配送中',delivered:'已签收/售后中',completed:'已完成',refunded:'已退款',returned:'已退货'}[o.status]||o.status}</span></span></div>
      <div style="margin:5px 0"><b>${o.brand}</b> ${o.model} <span class="muted">(${o.consignment_code})</span></div>
      <div class="muted" style="font-size:12px">${o.buyer_name||''} · ${o.outbound_carrier?('发货 '+o.outbound_carrier+'/'+o.outbound_tracking):'未发货'}</div>

/* ================= 弹窗表单 ================= */
function modal(title, fields, onOk, okText='提交'){
  $('#mTitle').textContent=title;
  $('#mBody').innerHTML = fields.map(f=>{
    if (f.type==='html') return f.html;
    const req=f.required!==false?'*':'';
    let inp='';
    if (f.type==='select') inp=`<select data-k="${f.key}">${f.options.map(o=>{
      const [v,l]=Array.isArray(o)?o:[o,o]; return `<option value="${v}" ${f.value==v?'selected':''}>${l}</option>`;}).join('')}</select>`;
    else if (f.type==='textarea') inp=`<textarea data-k="${f.key}" placeholder="${f.ph||''}">${f.value||''}</textarea>`;
    else inp=`<input data-k="${f.key}" type="${f.type||'text'}" value="${f.value??''}" placeholder="${f.ph||''}">`;
    return `<div class="field"><label>${f.label} ${req}</label>${inp}</div>`;
  }).join('');
  $('#mOk').textContent=okText;
  $('#modalMask').classList.remove('hidden');
  $('#mCancel').onclick=()=>$('#modalMask').classList.add('hidden');
  $('#mOk').onclick=async ()=>{
    const body={};
    $('#mBody').querySelectorAll('[data-k]').forEach(el=>{
      let v=el.value;
      if (el.type==='number') v = v===''?null:Number(v);
      body[el.dataset.k]=v;
    });
    try{ await onOk(body); $('#modalMask').classList.add('hidden'); }
    catch(e){ toast(e.message,'err'); }
  };
}
const actBtn = (label, fn, cls='') => `<button class="btn sm ${cls}" data-act="${label}">${label}</button>`;
function bindActions(box, map){
  box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const fn = map[b.dataset.act];
    if (!fn) return;
    Promise.resolve()
      .then(()=>fn())
      .catch((e)=>toast(e.message || String(e), 'err'));
  });
}

/* ================= 订单详情 ================= */
async function renderOrderDetail(id){
  let d;
  try{
    const all=(await api('/api/orders')).items;
    d=all.find(o=>Number(o.id)===Number(id));
    const cd=await api('/api/consignments/'+d.consignment_id);
    $('#detailTitle').innerHTML = `订单 ${d.code} <span class="tag info">${cd.code}</span>`;
    const insp = await api(`/api/orders/${d.id}/return-inspections`).catch(()=>({items:[]}));
    $('#detailBody').innerHTML = `
      ${d.settlement_paused?`<div class="pause-banner">⏸ 该订单结算已暂停：${d.settlement_pause_reason||''}</div>`:''}
      ${d.refund_frozen?`<div class="lock-banner">🧊 退款已冻结：${d.refund_freeze_reason||'退回复核状态异常，争议处理中'}</div>`:''}
      <div class="section"><div class="t">订单信息</div><div class="c">
        <div style="margin-bottom:8px"><b>${cd.brand} ${cd.model}</b> · ${cd.seller_name} 的寄卖单 ${cd.code}</div>
        <div class="kv">
          <span class="k">成交金额</span><span class="price">${fmt(d.amount)}</span>
          <span class="k">佣金费率</span><span>${Number(d.commission_rate)*100}%（平台佣金 ${fmt(d.platform_fee)}）</span>
          <span class="k">卖家应结</span><span>${fmt(d.seller_proceeds)}（担保托管，完结放款）</span>
          <span class="k">状态</span><span>${d.status}${d.refund_frozen?' · <b style="color:var(--bad)">退款冻结</b>':''}</span>
          <span class="k">出库物流</span><span>${d.outbound_carrier?d.outbound_carrier+' / '+d.outbound_tracking:'—'}</span>
          <span class="k">收货视频</span><span>${d.receiving_video_url||'未上传'}</span>
          <span class="k">签收时间</span><span>${DT(d.delivered_at)}</span>
          <span class="k">售后期限至</span><span>${DT(d.aftersales_until)}</span>
        </div>
        <div class="pill-actions" id="oAct"></div>
      </div></div>
      ${returnInspectionBlock(insp.items)}
      ${confirmBlock(cd)} ${await timelineBlock(cd.id)}`;
    const acts=[];
    if (['warehouse','ops','admin'].includes(ME.role)&&d.status==='placed') acts.push(['平台发货（高价值需先出库复核）',()=>orderShip(d,cd)]);
    if (ME.role==='buyer'&&Number(d.buyer_id)===ME.id&&d.status==='shipping') acts.push(['签收验收（上传收货视频）',()=>orderReceive(d)]);
    if ((ME.role==='buyer'&&Number(d.buyer_id)===ME.id&&d.status==='delivered')||['ops','admin'].includes(ME.role)&&d.status==='delivered')
      acts.push(['确认完成·售后期满放款',()=>orderComplete(d)]);
    if (ME.role==='buyer'&&Number(d.buyer_id)===ME.id&&d.status==='delivered') acts.push(['申请退货（重核保价物流）',()=>orderReturn(d)]);
    if (['warehouse','admin'].includes(ME.role)) acts.push(['退回复核（划痕/附件/吊牌/防拆扣）',()=>returnReceive(d)]);
    // 买家就冻结的退回复核提交解释
    const pendingInsp = (insp.items||[]).find(x=>x.result==='changed' && !x.buyer_explanation);
    if (ME.role==='buyer'&&Number(d.buyer_id)===ME.id&&pendingInsp)
      acts.push(['提交退货解释与证据',()=>buyerExplain(d,pendingInsp)]);
    if (['cs','finance','admin'].includes(ME.role)&&(insp.items||[]).some(x=>x.result==='changed'&&!x.refund_impact))
      acts.push(['退回复核责任认定',()=>returnResolve(d,(insp.items||[]).find(x=>x.result==='changed'&&!x.refund_impact))]);
    if (['finance','admin'].includes(ME.role)&&['returned','delivered'].includes(d.status)&&!d.refund_frozen) acts.push(['财务退款',()=>orderRefund(d)]);
    if (['cs','ops','admin','warehouse'].includes(ME.role)) acts.push(['就该订单开争议',()=>{selectedId=cd.id;openDisputeForm(cd,null);}]);
    const box=$('#oAct');
    if (acts.length){
      box.innerHTML=acts.map(([l])=>actBtn(l)).join('');
      const map={}; acts.forEach(([l,fn])=>map[l]=fn); bindActions(box,map);
    }
  }catch(e){toast(e.message,'err');}
}
function returnInspectionBlock(items){
  if(!items||!items.length) return '';
  const SCR={consistent:'一致',new_scratch:'新增划痕',worse:'明显变差'};
  const ACC={all_present:'齐全',missing:'缺失',swapped:'疑似调换',damaged:'损坏'};
  const TAG={intact:'完好',missing:'缺失',damaged:'损坏'};
  const SEAL={intact:'完好',removed:'已拆除',damaged:'损坏'};
  const IMPACT={full_refund:'全额退款',partial_refund:'部分退款',refund_denied:'不予退款'};
  const RESP={buyer:'买家',platform:'平台',logistics:'物流',seller:'卖家',none:'无责'};
  return `<div class="section"><div class="t">退回复核记录（仓库开箱证据 vs 买家解释）</div><div class="c">
    ${items.map(x=>`
      <div style="border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:11px">
        <div style="margin-bottom:7px">
          <span class="tag ${x.result==='consistent'?'ok':'bad'}">${x.result==='consistent'?'四项一致':'状态变化·退款冻结'}</span>
          <span class="tag">经办人 ${x.warehouse_name}</span>
          <span class="muted" style="font-size:11px">${DT(x.created_at)}</span>
        </div>
        <table>
          <tr><th>核对项</th><th>结果</th><th>说明</th></tr>
          <tr><td>划痕/成色</td><td><span class="tag ${x.scratch_status==='consistent'?'ok':'bad'}">${SCR[x.scratch_status]}</span></td><td class="muted">${x.scratch_detail||'—'}</td></tr>
          <tr><td>附件</td><td><span class="tag ${x.accessories_status==='all_present'?'ok':'bad'}">${ACC[x.accessories_status]}</span></td>
            <td class="muted">应退：${(x.accessories_expected||[]).join('、')||'—'}<br>实到：${(x.accessories_found||[]).join('、')||'—'}${x.accessories_detail?'<br>'+x.accessories_detail:''}</td></tr>
          <tr><td>吊牌</td><td><span class="tag ${x.tag_status==='intact'?'ok':'bad'}">${TAG[x.tag_status]}</span></td><td></td></tr>
          <tr><td>防拆扣</td><td><span class="tag ${x.tamper_seal_status==='intact'?'ok':'bad'}">${SEAL[x.tamper_seal_status]}</span></td><td class="muted">${x.tamper_seal_detail||'—'}</td></tr>
        </table>
        ${x.tamper_seal_impact?`<div class="lock-banner" style="margin:8px 0">🔩 防拆扣影响（单独记录）：${x.tamper_seal_impact}</div>`:''}
        <div class="muted" style="font-size:12px;margin:7px 0">开箱视频：${x.open_box_video?`<a>${x.open_box_video}</a>`:'未提供'}　平台照片：${(x.platform_photos||[]).join('、')||'无'}</div>
        <div class="grid2" style="gap:10px">
          <div style="background:#14161f;border:1px solid var(--line);border-radius:7px;padding:9px">
            <b style="font-size:12.5px">🏢 平台证据</b><pre class="muted" style="margin-top:5px">${x.warehouse_note||'—'}</pre></div>
          <div style="background:#14161f;border:1px solid var(--line);border-radius:7px;padding:9px">
            <b style="font-size:12.5px">🙋 买家解释（并列保存）</b>
            ${x.buyer_explanation?`<pre style="margin-top:5px">${x.buyer_explanation}</pre><div class="muted" style="font-size:11px">证据：${(x.buyer_evidence||[]).join('、')||'无'} · ${x.buyer_name} · ${DT(x.buyer_explained_at)}</div>`:'<div class="muted" style="margin-top:5px">买家尚未提交</div>'}
          </div>
        </div>
        ${x.refund_impact?`<div style="margin-top:9px">
          <span class="tag ${x.refund_impact==='full_refund'?'ok':x.refund_impact==='refund_denied'?'bad':'warn'}">退款影响：${IMPACT[x.refund_impact]}${Number(x.deduct_amount)>0?'（扣除 ¥'+Number(x.deduct_amount).toLocaleString()+'）':''}</span>
          <span class="tag">责任：${RESP[x.responsibility]||'—'}</span>
          <pre class="muted" style="margin-top:6px">${x.refund_impact_detail||''}</pre></div>`:''}
      </div>`).join('')}
  </div></div>`;
}

    {key:'carrier',label:'承运人',value:'SF Express'},
    {key:'tracking',label:'单号',ph:'SF...'},
    ...(cd.high_value?[{type:'html',html:'<div class="tag warn">高价值件：必须已在寄卖单上登记 outbound/shipping 状态复核，否则发货被拦截</div>'}]:[]),
  ], async b=>{
    await api(`/api/orders/${d.id}/ship`,{method:'POST',body:b});
    toast('已发货','ok'); loadOrders().then(()=>renderOrderDetail(d.id));
  });
}
function orderReceive(d){
  modal('买家签收验收', [
    {key:'videoUrl',label:'收货视频 URL（交付证据）',value:'video://buyer-receipt.mp4'},
  ], async b=>{
    await api(`/api/orders/${d.id}/receive`,{method:'POST',body:b});
    toast('签收成功，7 天售后期开始','ok'); loadOrders().then(()=>renderOrderDetail(d.id));
  });
}
async function orderComplete(d){
  await api(`/api/orders/${d.id}/complete`,{method:'POST',body:{}});
  toast('交易完成，已担保放款（卖家到手+平台佣金入账）','ok'); loadOrders().then(()=>renderOrderDetail(d.id));
}
function orderReturn(d){
  modal('买家退货申请（售后期内）', [
    {key:'reason',label:'退货原因',type:'textarea'},
    {key:'returnCarrier',label:'退回承运人',value:'SF Express'},
    {key:'returnTracking',label:'退回单号'},
    {key:'photos',label:'凭证照片（逗号分隔）',required:false,value:'photo://return-pack.jpg'},
  ], async b=>{
    b.photos=b.photos?String(b.photos).split(',').map(s=>s.trim()):[];

function returnReceive(d){
  modal('仓库退回复核（划痕/附件/吊牌/防拆扣 + 开箱视频）', [
    {type:'html', html:`<div class="pause-banner" style="margin:0 0 10px">逐项与<b>出库状态复核</b>及<b>买家收货视频</b>比对。任一项不一致将<b>冻结退款并自动立案</b>；经办人会随开箱视频留档。</div>`},
    {key:'scratchStatus',label:'① 划痕/成色',type:'select',options:[['consistent','与出库一致'],['new_scratch','新增划痕'],['worse','成色明显变差']]},
    {key:'scratchDetail',label:'划痕说明（不一致时）',type:'textarea',required:false},
    {key:'accessoriesStatus',label:'② 附件',type:'select',options:[['all_present','附件齐全'],['missing','附件缺失'],['swapped','疑似调换'],['damaged','附件损坏']]},
    {key:'accessoriesFound',label:'实到附件（逗号分隔，缺失时留空或只填实际收到项）',required:false},
    {key:'accessoriesDetail',label:'附件说明',type:'textarea',required:false},
    {key:'tagStatus',label:'③ 吊牌',type:'select',options:[['intact','吊牌完好'],['missing','吊牌缺失'],['damaged','吊牌损坏']]},
    {key:'tamperSealStatus',label:'④ 防拆扣（关键）',type:'select',options:[['intact','防拆扣完好未拆'],['removed','防拆扣已被拆除'],['damaged','防拆扣损坏']]},
    {key:'tamperSealDetail',label:'防拆扣情况说明',type:'textarea',required:false},
    {key:'openBoxVideo',label:'开箱视频 URL（经办人留证，必录）',value:'video://return-openbox.mp4'},
    {key:'platformPhotos',label:'平台复核照片（逗号分隔）',required:false,value:'photo://return-check-1.jpg, photo://return-check-2.jpg'},
    {key:'warehouseNote',label:'经办备注',type:'textarea',required:false},
  ], async b=>{
    b.platformPhotos=b.platformPhotos?String(b.platformPhotos).split(',').map(s=>s.trim()).filter(Boolean):[];
    if(b.accessoriesFound!==undefined) b.accessoriesFound=b.accessoriesFound?String(b.accessoriesFound).split(',').map(s=>s.trim()).filter(Boolean):[];
    const r=await api(`/api/orders/${d.id}/return-receive`,{method:'POST',body:b});
    toast(r.message, r.disputed?'err':'ok');
    loadOrders().then(()=>renderOrderDetail(d.id));
    if(r.disputed) setTimeout(()=>switchTab('disputes'),600);
  }, '提交退回复核');
}
async function orderRefund(d){
  await api(`/api/orders/${d.id}/refund`,{method:'POST',body:{}});
  toast('退款已执行','ok'); loadOrders().then(()=>renderOrderDetail(d.id));
}

/* ================= 争议详情 ================= */
async function renderDisputeDetail(id){
  let d;
  try{ d=await api('/api/disputes/'+id); }catch(e){return toast(e.message,'err');}
  $('#detailTitle').innerHTML = `${d.code} <span class="tag ${d.status==='resolved'?'ok':'bad'}">${{opened:'已立案',investigating:'调查中',resolved:'已裁决',closed:'已结案'}[d.status]}</span>`;
  const parties=(d.parties||[]).map(p=>`<span class="tag info">${ROLE[p.role]||p.role} · ${p.name}</span>`).join('');
  $('#detailBody').innerHTML = `
    <div class="section"><div class="t">案件信息</div><div class="c">
      <div style="margin-bottom:8px"><b>${d.summary}</b></div>
      <div class="kv">
        <span class="k">寄卖单</span><span><a id="goCon">${d.consignment_code}</a> · ${d.brand} ${d.model} ${d.high_value?'<span class="tag gold">高价值</span>':''}</span>
        <span class="k">关联订单</span><span>${d.order_code||'无'} ${d.order_amount?fmt(d.order_amount):''}</span>
        <span class="k">发起人</span><span>${d.opener_name}</span>
        <span class="k">同案相关方</span><span>${parties}</span>
      </div>
      <div class="pill-actions" id="dAct"></div>
    </div></div>
    <div class="section"><div class="t">自动归集的鉴定与交付证据（${(d.linked_evidence||[]).length}）</div><div class="c">
      <pre class="muted">${(d.linked_evidence||[]).join('\n')}</pre></div></div>
    ${(d.returnInspections||[]).length?returnInspectionBlock(d.returnInspections):''}
    <div class="section"><div class="t">鉴定轮次 / 状态复核对照</div><div class="c">
      ${d.authentications.map(a=>`<div><span class="tag ${a.overturned?'bad':'info'}">第${a.round}轮</span>
        ${({authentic:'正品',fake:'假冒',suspicious:'存疑'})[a.result]} / 成色${a.grade} ${a.overturned?'<span class="tag bad">推翻初鉴</span>':''}
        <span class="muted">${a.primary_name}${a.second_name?' + '+a.second_name+'（双人）':''}</span></div>`).join('')||'<span class="muted">无</span>'}
      <hr style="border-color:var(--line);margin:10px 0">
      ${d.confirmations.map(s=>`<div style="font-size:12.5px;padding:3px 0"><span class="tag ${s.matches_previous?'ok':'bad'}">${s.checkpoint}</span>
        <span class="muted">${s.condition_summary}</span></div>`).join('')||'<span class="muted">无复核记录</span>'}
    </div></div>
    <div class="section"><div class="t">多方协查线程（卖家/鉴定师/仓库/客服/买家/财务）</div><div class="c" id="msgBox">
      ${d.messages.map(m=>`<div style="padding:8px 0;border-bottom:1px dashed var(--line)">
        <span class="tag gold">${ROLE[m.author_role]||m.author_role}${m.author_name?' · '+m.author_name:''}</span>
        <span class="muted" style="font-size:11px">${DT(m.created_at)}</span>
        <pre style="margin-top:4px">${m.content}</pre>
        ${(m.evidence||[]).length?`<div class="muted" style="font-size:11px">证据：${m.evidence.join('、')}</div>`:''}
      </div>`).join('')}
      <div class="pill-actions"><button class="btn sm ghost" id="addMsg">举证 / 留言</button></div>
    </div></div>
    ${d.status==='resolved'?resolveBlock(d):''}
    ${d.ledger.length?`<div class="section"><div class="t">裁决资金流水（可追溯）</div><div class="c">${ledgerTable(d.ledger)}</div></div>`:''}
  `;
  $('#goCon').onclick=()=>{ switchTab('con').then(()=>{}); setTimeout(async()=>{
    selectedId=d.consignment_id;
    const el=[...document.querySelectorAll('.list-item')].find(x=>Number(x.dataset.id)===d.consignment_id);
    if(el){el.click();} else { renderConsignmentDetail(d.consignment_id); }
  },500); };
  $('#addMsg').onclick=()=>modal('举证 / 留言', [
    {key:'content',label:'内容',type:'textarea'},
    {key:'evidence',label:'证据（逗号分隔）',required:false},
  ], async b=>{
    b.evidence=b.evidence?String(b.evidence).split(',').map(s=>s.trim()).filter(Boolean):[];
    await api(`/api/disputes/${id}/messages`,{method:'POST',body:b});
    toast('已提交','ok'); renderDisputeDetail(id);
  });
  const acts=[];
  if (['cs','admin','ops'].includes(ME.role)&&d.status==='opened') acts.push(['客服受理调查',async()=>{
    await api(`/api/disputes/${id}/investigate`,{method:'POST',body:{}});
    toast('已受理','ok'); renderDisputeDetail(id);
  }]);
  if (['authenticator','admin'].includes(ME.role)&&d.status!=='resolved') acts.push(['发起平台复鉴（推翻即锁货闭环）',async()=>{
    selectedId=d.consignment_id; const cd=await api('/api/consignments/'+d.consignment_id); reauthForm(cd);
  }]);
  if (['cs','finance','admin'].includes(ME.role)&&d.status!=='resolved') acts.push(['裁决（退款/赔付/让佣/保险/处置/黑名单）',()=>resolveForm(d)]);
  const box=$('#dAct');
  if (acts.length){ box.innerHTML=acts.map(([l],i)=>actBtn(l,'','')).join(''); const map={}; acts.forEach(([l,fn])=>map[l]=fn); bindActions(box,map); }
}
function resolveBlock(d){
  return `<div class="section"><div class="t">裁决结果</div><div class="c">
    <pre>${d.ruling}</pre>
    <div style="margin-top:8px">
      <span class="tag">退款买家 ${fmt(d.refund_amount)}</span>
      <span class="tag">赔付 ${fmt(d.compensation_amount)}</span>
      <span class="tag">平台让佣 ${fmt(d.commission_adjust)}</span>
      <span class="tag">保险理赔 ${fmt(d.insurance_claim)}</span>
      <span class="tag gold">商品：${{return_seller:'退回卖家',keep_buyer:'买家保留',resell:'重新上架',destroy:'销毁'}[d.item_disposition]}</span>
      ${d.blacklist_party_id?'<span class="tag bad">相关方已列入黑名单</span>':''}
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">裁决人：${d.resolver_name||'—'} · ${DT(d.resolved_at)}</div>
  </div></div>`;
}
function ledgerTable(rows){
  return `<table><tr><th>账户</th><th>类型</th><th>方向</th><th>金额</th><th>证据引用</th><th>时间</th></tr>
  ${rows.map(l=>`<tr><td>${({buyer:'买家',seller:'卖家',platform:'平台',insurance:'保险',warehouse:'仓库',auction:'拍卖'})[l.account]}</td>
    <td>${l.entry_type}</td><td class="${l.direction==='credit'?'':'muted'}">${l.direction==='credit'?'收入':'支出'}</td>
    <td class="price">${fmt(l.amount)}</td><td class="muted" style="font-size:11px">${l.evidence_ref||'—'}</td><td class="muted">${DT(l.created_at)}</td></tr>`).join('')}</table>`;
}
function resolveForm(d){
  const partyOpts=(d.parties||[]).map(p=>[p.userId, `${ROLE[p.role]||p.role} · ${p.name}`]);
  modal('争议裁决（资金全部按案件编号入账，可追溯鉴定与交付证据）', [
    {key:'ruling',label:'裁决说明（责任认定与依据）',type:'textarea',ph:'对照鉴定记录/状态复核/收货视频说明责任归属'},
    {key:'refundAmount',label:'退款给买家金额',type:'number',value:d.order_amount||0},
    {key:'compensationAmount',label:'额外赔付金额',type:'number',value:0},
    {key:'compensateParty',label:'赔付对象',type:'select',options:[['buyer','买家'],['seller','卖家']]},
    {key:'commissionAdjust',label:'平台让佣金额',type:'number',value:0},
    {key:'insuranceClaim',label:'保险理赔金额',type:'number',value:0},
    {key:'itemDisposition',label:'商品处置',type:'select',
      options:[['return_seller','退回卖家'],['keep_buyer','买家保留（继续成交）'],['resell','重新上架寄卖'],['destroy','销毁（如假品）']]},
    {key:'returnCarrier',label:'退回物流承运人（退回卖家时）',required:false},
    {key:'returnTracking',label:'退回物流单号',required:false},
    {key:'blacklistPartyId',label:'列入黑名单的相关方',type:'select',required:false,
      options:[['','— 不加入黑名单 —'],...partyOpts]},
    {key:'blacklistReason',label:'黑名单原因',required:false},
  ], async b=>{
    ['refundAmount','compensationAmount','commissionAdjust','insuranceClaim'].forEach(k=>b[k]=Number(b[k]||0));
    b.blacklistPartyId=b.blacklistPartyId?Number(b.blacklistPartyId):null;
    await api(`/api/disputes/${d.id}/resolve`,{method:'POST',body:b});
    toast('裁决完成，资金流水已按案件编号归档','ok'); renderDisputeDetail(d.id);
  });
}

/* ================= 复鉴推翻闭环 ================= */
async function loadReauths(){
  const d = await api('/api/reauth-reviews');
  $('#listBody').innerHTML = d.items.length ? d.items.map(x=>{
    const changed = (x.authenticity_changed||x.grade_changed);
    return `<div class="list-item" data-id="${x.id}">
      <div class="li-top"><span class="code">${x.code}</span>
        <span class="tag bad">推翻初鉴</span></div>
      <div style="margin:5px 0"><b>${x.brand}</b> ${x.model} <span class="muted">(${x.consignment_code})</span></div>
      <div class="muted" style="font-size:12px">初鉴 ${x.initial_auth_name} → 复鉴 ${x.reauth_name}${x.order_code?' · 订单 '+x.order_code:''}</div>
      <div style="margin-top:4px">
        ${x.settlement_paused?'<span class="tag bad">结算暂停</span>':''}
        ${x.locked?'<span class="tag bad">🔒锁定</span>':''}
        <span class="tag ${x.status==='closed'?'ok':'warn'}">${{opened:'处理中',awaiting_buyer:'待买家选择',responsibility_reviewed:'已复盘',closed:'已结案'}[x.status]}</span>
      </div>
    </div>`;
  }).join('') : '<div class="empty">暂无复鉴推翻案件<br><span class="muted" style="font-size:12px">在寄卖单详情点「平台复鉴」，当真伪/成色改变时自动生成</span></div>';
  $('#listBody').querySelectorAll('.list-item').forEach(el=>el.onclick=()=>{
    selectedReauth=Number(el.dataset.id);
    $('#listBody').querySelectorAll('.list-item').forEach(x=>x.classList.toggle('sel',x===el));
    renderReauthDetail(selectedReauth);
  });
  if (selectedReauth){ const el=$('#listBody').querySelector(`[data-id="${selectedReauth}"]`); if(el) el.classList.add('sel'); renderReauthDetail(selectedReauth); }
}

async function renderAudits(d){
  const box=$('#rrAudits');
  if(!d.audits.length){ box.innerHTML='<span class="muted">本次未发现需要抽查的同品牌近期初鉴记录</span>'; return; }
  box.innerHTML=`<table><tr><th>抽查单</th><th>寄卖单</th><th>原鉴定师</th><th>结果</th><th>发现</th><th>知识库</th><th></th></tr>
    ${d.audits.map(a=>`<tr>
      <td>${a.code}</td><td>${a.consignment_code||a.consignment_id}</td><td>${a.authenticator_name}</td>
      <td>${a.status==='pending'?'<span class="tag warn">待抽查</span>':({consistent:'<span class="tag ok">一致</span>',mismatch:'<span class="tag bad">不一致</span>',uncertain:'<span class="tag">存疑</span>'})[a.result]}</td>
      <td class="muted" style="max-width:220px">${a.finding||'—'}</td>
      <td>${a.promoted_kb?'<span class="tag ok">已沉淀</span>':'未沉淀'}</td>
      <td id="auditAct${a.id}"></td></tr>`).join('')}</table>`;
  for (const a of d.audits){
    const cell=$(`#auditAct${a.id}`); if(!cell) continue;
    if (a.status==='pending'){
      cell.innerHTML=`<button class="btn sm" data-do="review">登记抽查结果</button>`;
      cell.querySelector('[data-do=review]').onclick=()=>modal('同品牌抽查复核 · '+a.code,[
        {key:'result',label:'抽查结论',type:'select',options:[['consistent','与初鉴一致'],['mismatch','与初鉴不一致'],['uncertain','暂无法确定']]},
        {key:'finding',label:'抽查发现',type:'textarea',ph:'核验序列号/五金/皮质/走线/票据后的发现'},
      ],async b=>{
        await api(`/api/brand-audits/${a.id}/review`,{method:'POST',body:b});
        toast('抽查结果已登记','ok');
        if(b.result!=='consistent') setTimeout(()=>promoteModal(a,d.brand,b.finding),300);
        renderReauthDetail(d.id);
      });
    } else if(!a.promoted_kb && a.result!=='consistent'){
      cell.innerHTML=`<button class="btn sm ghost" data-do="promote">沉淀进知识库</button>`;
      cell.querySelector('[data-do=promote]').onclick=()=>promoteModal(a,d.brand,a.finding);
    }
  }
}

  const u=usersCache;
  $('#detailBody').innerHTML=`<table><tr><th>用户</th><th>角色</th><th>状态</th><th>原因</th><th>操作</th></tr>
    ${u.map(x=>`<tr><td>${x.display_name}<div class="muted" style="font-size:11px">${x.username}</div></td>
      <td>${ROLE[x.role]}</td><td>${x.blacklisted?'<span class="tag bad">黑名单</span>':'正常'}</td>
      <td class="muted">${x.blacklist_reason||''}</td>
      <td>${x.blacklisted
        ? `<button class="btn sm ghost" data-un="${x.id}">解封</button>`
        : `<button class="btn sm danger" data-bl="${x.id}">封禁</button>`}</td></tr>`).join('')}</table>`;
  $('#detailBody').querySelectorAll('[data-bl]').forEach(b=>b.onclick=()=>modal('列入黑名单',[
    {key:'reason',label:'原因'},
  ],async x=>{ await api('/api/users/'+b.dataset.bl+'/blacklist',{method:'POST',body:x}); toast('已封禁','ok'); usersCache=[]; adminBlacklist(); }));
  $('#detailBody').querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{
    await api('/api/users/'+b.dataset.un+'/unblacklist',{method:'POST',body:{}});
    toast('已解封','ok'); usersCache=[]; adminBlacklist();
  });
}

/* ================= 启动 ================= */
renderAccts();
if (localStorage.tok && localStorage.me){ try{ enterApp(); }catch{ localStorage.clear(); } }
</script>
</body>
</html>
